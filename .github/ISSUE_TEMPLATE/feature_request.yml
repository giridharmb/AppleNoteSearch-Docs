name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution. What is slow, awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like NoteSearch to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
  - type: dropdown
    id: importance
    attributes:
      label: How much would this help you?
      options:
        - Nice to have
        - I would use it weekly
        - I would use it daily
        - I can't use NoteSearch without it
    validations:
      required: true
